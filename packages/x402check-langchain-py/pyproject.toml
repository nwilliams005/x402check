[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x402check-langchain"
version = "0.1.2"
description = "LangChain tools for x402check — check before paying any x402 endpoint; is this API a scam/safe (ok|caution|avoid + history)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "x402check" }]
keywords = ["x402", "x402check", "langchain", "ai-agent", "preflight", "payto", "base", "usdc", "check-before-paying", "scam-check", "verify-payto", "budget-guard"]
dependencies = [
  "httpx>=0.27",
  "langchain-core>=0.3",
]

[project.urls]
Homepage = "https://x402check.dev"
Documentation = "https://x402check.dev/llms.txt"
Repository = "https://github.com/nwilliams005/x402check"

[tool.setuptools.packages.find]
include = ["x402check_langchain*"]
